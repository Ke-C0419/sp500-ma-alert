name: SPX 150MA Monitor

# 触发:
#   - 工作日盘后: UTC 22:00 周一~周五 (美股收盘后约1-2小时, 等数据写入)
#     · 夏令时: 北京次日 06:00
#     · 冬令时: 北京次日 07:00
#   - 周六心跳: UTC 02:00 周六 (北京周六 10:00)
#   - 支持手动触发 (可指定 mode: daily / heartbeat)
on:
  schedule:
    - cron: '0 22 * * 1-5'   # 工作日盘后
    - cron: '0 2 * * 6'      # 周六心跳
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式 (daily=日常告警 / heartbeat=周六心跳)'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - heartbeat

# 防止并发跑同一个时写覆盖状态文件
concurrency:
  group: sp500-ma-alert
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: state
          # 动态 key: 每次运行都不同, 保证跑完后能上传新版本
          # restore-keys 前缀匹配: 取最近一次的 state 作为恢复起点
          key: sp500-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sp500-state-

      - name: Run monitor
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: UTC
        run: |
          # 优先用 dispatch 传入的 mode, 否则让脚本自动判断
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            echo "非手动触发, 脚本自动判断模式"
            python scripts/sp500_ma_alert.py
          else
            echo "手动触发, mode=$MODE"
            python scripts/sp500_ma_alert.py "$MODE"
          fi

      - name: Show state after run
        if: always()
        run: |
          echo "=== 当前状态文件内容 ==="
          cat state/sp500_state.json 2>/dev/null || echo "(无状态文件)"
